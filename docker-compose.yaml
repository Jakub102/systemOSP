services:
  database:
    image: mysql:8.0
    container_name: service-database-mysql
    env_file:
      - ./.env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ospsystem}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-R00tP@ssw0rd}
      MYSQL_USER: ${DB_USERNAME:-system_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-P@ssw0rd}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-R00tP@ssw0rd}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - service-network

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: service-phpmyadmin
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: database
      PMA_USER: ${DB_USERNAME:-system_user}
      PMA_PASSWORD: ${DB_PASSWORD:-P@ssw0rd}
      UPLOAD_LIMIT: 300M
    depends_on:
      database:
        condition: service_healthy
    networks:
      - service-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: service-api-laravel
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    env_file:
      - ./.env
    environment:
      DB_HOST: database
    depends_on:
      database:
        condition: service_healthy
    networks:
      - service-network

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: service-queue-laravel
    entrypoint: []
    command: ["php", "artisan", "queue:work", "--queue=alarms,default", "--tries=5", "--timeout=30", "--sleep=1"]
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    env_file:
      - ./.env
    environment:
      DB_HOST: database
    depends_on:
      backend:
        condition: service_started
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - service-network

  web-panel:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: service-web-react
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./.env
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - service-network

networks:
  service-network:
    driver: bridge

volumes:
  db_data:
    driver: local
